name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt pytest

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Import smoke (JEPA + SE-ResNet)
        run: |
          python -c "
          import torch
          from models.jepa.module import JEPAModule
          from models.seresnet import seresnet50_from_scratch
          m = JEPAModule(backbone='seresnet50', mask_aware_se=True)
          x = torch.randn(1, 3, 224, 224)
          loss, _ = m(x)
          print('JEPA OK', float(loss))
          net = seresnet50_from_scratch(num_classes=3, mask_aware_se=True)
          print('SEResNet OK', net(x).shape)
          "

      - name: Regenerate paper tables (from committed JSON)
        run: python scripts/generate_paper_tables.py

      - name: Check paper tables unchanged
        run: git diff --exit-code docs/paper/shared/tables/results.tex || (
          echo "Run: python scripts/generate_paper_tables.py && commit"
          exit 1
        )
